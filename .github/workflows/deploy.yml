name: Drupal Infrastructure CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  ASG_NAME: drupal-network-asg

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform

  deploy-staging:
    name: Deploy to staging
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS access
        run: aws sts get-caller-identity

      - name: Find Drupal Auto Scaling instances
        id: instances
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          if [ -z "$IDS" ] || [ "$IDS" = "None" ]; then
            echo "No InService instances found."
            exit 1
          fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"


      - name: Verify Drupal service on ASG instances
        env:
          INSTANCE_IDS: ${{ steps.instances.outputs.ids }}
        run: |
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Checking Apache on $INSTANCE_ID"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters '{"commands":["sudo systemctl is-active apache2"]}' \
              --query 'Command.CommandId' \
              --output text)

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)

            if [ "$STATUS" != "Success" ]; then
              echo "Apache check failed on $INSTANCE_ID"
              exit 1
            fi
          done


      - name: Smoke test staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          test -n "$STAGING_URL"
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 10 "$STAGING_URL" -o /dev/null

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify production Drupal instances
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          test -n "$IDS"
          echo "Production ASG instances: $IDS"

      - name: Production smoke test
        env:
          PRODUCTION_URL: ${{ vars.STAGING_URL }}
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --show-error --silent "$PRODUCTION_URL" -o /dev/null
